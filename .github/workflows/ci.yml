name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Runtime (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Public source and identity boundary
        run: python scripts/check_public_release.py
      - name: Install the package
        run: python -m pip install .
      - name: Runtime and recovery regressions
        run: python -m unittest discover -s tests -v
      - name: Shared core integrity with normalized checkout
        run: python scripts/check_core.py
      - name: CLI and HTTP in an isolated Unicode workspace
        run: python scripts/verify_portability.py
      - name: Installed shared kernel synthetic case
        run: python scripts/verify_kernel.py
      - name: Historical public-source product path
        run: python scripts/verify_public_case.py
      - name: Build universal wheel
        run: python -m pip wheel --no-deps . -w dist
  windows-install:
    name: Windows clean PowerShell install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Follow the documented venv route without activation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP 'agent venv'
          python -m venv "$venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          & "$python" -m pip install .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$python" scripts/verify_portability.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$python" scripts/verify_kernel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$python" scripts/verify_public_case.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t field-agent .
      - run: docker run --rm field-agent demo
