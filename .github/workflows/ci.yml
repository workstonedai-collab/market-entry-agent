name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_public_release.py
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_core.py
      - run: market-entry-agent --workspace "$RUNNER_TEMP/demo" demo > "$RUNNER_TEMP/run.json"
      - run: market-entry-agent --workspace "$RUNNER_TEMP/demo" list
      - run: python -m pip wheel --no-deps . -w dist
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t field-agent .
      - run: docker run --rm field-agent demo
